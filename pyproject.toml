[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# PROJECT
# -----------------------------------------------------------------------------

[project]
name = "compose2rancher"
version = "0.1.0-alpha"
description = "Enterprise Docker Compose to Rancher/Kubernetes Migration Toolkit"
readme = "README.md"
license = { text = "Apache-2.0" }

requires-python = ">=3.12"

authors = [
    { name = "Arturo Villaseñor J" }
]

maintainers = [
    { name = "Arturo Villaseñor J" }
]

keywords = [
    "docker",
    "docker-compose",
    "kubernetes",
    "rancher",
    "rke2",
    "k3s",
    "kompose",
    "migration",
    "containers",
    "devops"
]

classifiers = [

    "Development Status :: 3 - Alpha",

    "Environment :: Console",

    "Intended Audience :: Developers",

    "Intended Audience :: System Administrators",

    "License :: OSI Approved :: Apache Software License",

    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.12",

    "Programming Language :: Python :: 3.13",

    "Topic :: Software Development",

    "Topic :: System :: Systems Administration",

    "Topic :: Utilities"
]

dependencies = [

    "typer>=0.16.0",

    "rich>=14.0.0",

    "PyYAML>=6.0.2",

    "pydantic>=2.11.0",

    "loguru>=0.7.3",

    "jinja2>=3.1.6",

    "tabulate>=0.9.0",

    "python-dotenv>=1.1.1",

    "pydantic-settings>=2.10.1",

    "packaging>=25.0"

]

# -----------------------------------------------------------------------------
# OPTIONAL DEPENDENCIES
# -----------------------------------------------------------------------------

[project.optional-dependencies]

dev = [

    "pytest>=8.4.0",

    "pytest-cov>=6.2.1",

    "pytest-mock>=3.14.1",

    "coverage>=7.10.0",

    "ruff>=0.12.0",

    "black>=25.1.0",

    "mypy>=1.17.0",

    "types-PyYAML",

    "pre-commit>=4.2.0"
]

docs = [

    "mkdocs>=1.6.1",

    "mkdocs-material>=9.6.0"
]

# -----------------------------------------------------------------------------
# CLI
# -----------------------------------------------------------------------------

[project.scripts]

compose2rancher = "compose2rancher.cli:app"

# -----------------------------------------------------------------------------
# HATCH
# -----------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]

packages = [
    "src/compose2rancher"
]

# -----------------------------------------------------------------------------
# BLACK
# -----------------------------------------------------------------------------

[tool.black]

line-length = 100

target-version = [
    "py312"
]

skip-string-normalization = false

# -----------------------------------------------------------------------------
# RUFF
# -----------------------------------------------------------------------------

[tool.ruff]

line-length = 100

target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "dist",
    "build",
    "__pycache__"
]

[tool.ruff.lint]

select = [

    "E",

    "F",

    "I",

    "UP",

    "B",

    "SIM",

    "C4",

    "N",

    "W"
]

ignore = [

    "E501"
]

# -----------------------------------------------------------------------------
# MYPY
# -----------------------------------------------------------------------------

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

ignore_missing_imports = true

# -----------------------------------------------------------------------------
# PYTEST
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = """

-v

--cov=compose2rancher

--cov-report=term-missing

--cov-report=html

"""

# -----------------------------------------------------------------------------
# COVERAGE
# -----------------------------------------------------------------------------

[tool.coverage.run]

source = [
    "src/compose2rancher"
]

omit = [

    "tests/*"
]

[tool.coverage.report]

show_missing = true

skip_covered = true

precision = 2

fail_under = 90
